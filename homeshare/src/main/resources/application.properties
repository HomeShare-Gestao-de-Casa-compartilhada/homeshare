spring.application.name=homeshare

# Banco H2 em memória (zera a cada vez que a aplicação reinicia)
spring.datasource.url=jdbc:h2:mem:homeshare;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# O Hibernate cria as tabelas a partir das @Entity
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# false = toda a leitura do banco acontece dentro do Service (@Transactional)
spring.jpa.open-in-view=false

# JWT. Em produção, defina a variável de ambiente HOMESHARE_JWT_SECRET (mín. 32 caracteres)
homeshare.jwt.secret=${HOMESHARE_JWT_SECRET:troque-esta-chave-em-producao-com-no-minimo-32-caracteres}
homeshare.jwt.expiracao-minutos=120
